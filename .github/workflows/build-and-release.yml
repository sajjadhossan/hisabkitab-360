name: Build Android APK & Windows PC Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Copy Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/
          chmod +x android/gradlew

      - name: Build Android APK (Debug / Standalone Installable)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/HisabKitab-360.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabKitab-360-Android-APK
          path: artifacts/HisabKitab-360.apk

  build-windows:
    name: 💻 Build Windows PC Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Package Native Windows Electron App & Launcher
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          npx electron-builder --win --publish never
          if (Test-Path "dist-electron\*.exe") {
            Copy-Item "dist-electron\*.exe" "artifacts\HisabKitab-360-Setup.exe" -Force
          }
          Compress-Archive -Path dist\* -DestinationPath src-desktop\app.zip -Force
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /resource:src-desktop\app.zip,app.zip /out:artifacts\HisabKitab-360-PC.exe src-desktop\Program.cs /reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll,System.Drawing.dll

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HisabKitab-360-Windows-EXE
          path: artifacts/*.exe

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android, build-windows]
    if: always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: HisabKitab-360-Android-APK
          path: release-files

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: HisabKitab-360-Windows-EXE
          path: release-files

      - name: Generate Automatic Release Tag
        id: vars
        run: echo "TAG_NAME=v1.0.$(date +%s)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Direct Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "HisabKitab 360 Release ${{ steps.vars.outputs.TAG_NAME }}"
          body: |
            ### হিসাবকিতাব ৩৬০ (HisabKitab 360) অফিসিয়াল রিলিজ

            - 📱 **Android Mobile APK:** `HisabKitab-360.apk` (মোবাইলে সরাসরি ইনস্টল করুন)
            - 💻 **Windows Desktop Setup (Electron):** `HisabKitab-360-Setup.exe` (আসল উইন্ডোজ ডেস্কটপ সফটওয়্যার, কোনো ব্রাউজার নয়)
            - ⚡ **Windows Portable App:** `HisabKitab-360-PC.exe` (সরাসরি পোর্টেবল এক্সিকিউটেবল)
            
            যেকোনো ডিভাইস থেকে নিচের অ্যাসেট লিংক থেকে সরাসরি ডাউনলোড করুন!
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
