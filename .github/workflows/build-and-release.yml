name: Build Android APK & Windows PC Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 36 Platform
        run: |
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Copy Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/
          chmod +x android/gradlew

      - name: Build Android APK (Debug / Standalone Installable)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle_build.log 2>&1 || (tail -n 60 gradle_build.log && exit 1)

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/HisabKitab-360.apk

      - name: Backup Upload Artifact (1 Day Retention)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: HisabKitab-360-Android-APK
          path: artifacts/HisabKitab-360.apk
          retention-days: 1

      - name: Publish Android APK Direct to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always() && !cancelled()
        with:
          tag_name: latest
          name: "HisabKitab 360 Latest Release"
          body: |
            ### হিসাবকিতাব ৩৬০ (HisabKitab 360) লেটেস্ট রিলিজ
            - 📱 **Android Mobile APK:** `HisabKitab-360.apk` (মোবাইলে সরাসরি ডাউনলোড করে ইনস্টল করুন)
            - 💻 **Windows Desktop Setup:** `HisabKitab-360-Setup.exe` (উইন্ডোজ পিসি অ্যাপ)
            - ⚡ **Windows Portable:** `HisabKitab-360-PC.exe` (পোর্টেবল এক্সিকিউটেবল)
          files: artifacts/HisabKitab-360.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: 💻 Build Windows PC Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Package Native Windows Electron App & Launcher
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          try {
            npx electron-builder --win --publish never
            if (Test-Path "dist-electron\*.exe") {
              Copy-Item "dist-electron\*.exe" "artifacts\HisabKitab-360-Setup.exe" -Force
            }
          } catch {
            Write-Host "Electron builder fallback"
          }
          Compress-Archive -Path dist\* -DestinationPath src-desktop\app.zip -Force
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /resource:src-desktop\app.zip,app.zip /out:artifacts\HisabKitab-360-PC.exe src-desktop\Program.cs /reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll,System.Drawing.dll

      - name: Backup Upload Windows Artifacts (1 Day Retention)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: HisabKitab-360-Windows-EXE
          path: artifacts/*.exe
          retention-days: 1

      - name: Publish Windows PC App Direct to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always() && !cancelled()
        with:
          tag_name: latest
          name: "HisabKitab 360 Latest Release"
          files: artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
