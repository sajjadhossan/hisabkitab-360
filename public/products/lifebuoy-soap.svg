  <text x="96" y="66" fill="#dc2626" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">TOTAL GERM PROTECT</text>
  <rect x="68" y="73" width="56" height="14" rx="7" fill="#dc2626"/>
