      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="soapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Soap Box Carton -->
  <rect x="15" y="15" width="130" height="80" rx="10" fill="url(#soapRedGrad)" stroke="#7f1d1d" stroke-width="2" filter="url(#soapShadow)"/>
