<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="somitiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0f766e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald-to-Teal primary ribbon -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan-to-Blue tech ribbon -->
    <linearGradient id="cyanGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Golden wealth & prosperity accent -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Dark glass container -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <filter id="somitiDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14b8a6" flood-opacity="0.35" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="94" fill="url(#somitiGlow)" />

  <!-- Outer 360 Orbital Track Ring -->
  <circle cx="100" cy="100" r="88" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Orbit Nodes (360 Degree Cadence) -->
  <circle cx="100" cy="12" r="3" fill="#38bdf8" />
  <circle cx="188" cy="100" r="3" fill="#34d399" />
  <circle cx="100" cy="188" r="3" fill="#fbbf24" />
  <circle cx="12" cy="100" r="3" fill="#2dd4bf" />

  <!-- Main Rounded Glass Emblem Body -->
  <rect x="20" y="20" width="160" height="160" rx="38" fill="url(#glassBg)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="2" filter="url(#somitiDropShadow)" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="22" y="22" width="156" height="156" rx="36" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- 360 Dynamic Interlocking Ribbons (Community Cooperative Loop) -->
  <g transform="translate(100, 96)">
    <!-- Loop 1: Left Wing (Emerald) -->
    <path d="M-42 6 C-42 -24 -18 -44 8 -44 C26 -44 38 -32 38 -18 C38 -4 24 6 6 8 C-16 10 -26 24 -26 36 C-26 44 -18 50 -8 50 C-26 50 -42 32 -42 6 Z"
          fill="url(#emeraldGrad)" opacity="0.95" />

    <!-- Loop 2: Right Wing (Cyan/Teal) -->
    <path d="M42 -6 C42 24 18 44 -8 44 C-26 44 -38 32 -38 18 C-38 4 -24 -6 -6 -8 C16 -10 26 -24 26 -36 C26 -44 18 -50 8 -50 C26 -50 42 -32 42 -6 Z"
          fill="url(#cyanGrad)" opacity="0.95" />

    <!-- Central Seed of Prosperity (Golden Diamond Spark) -->
    <path d="M0 -18 L13 0 L0 18 L-13 0 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />

    <!-- Center Core Glimmer -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />

    <!-- 3 Cooperative Pillars (Representing Members, Savings, Growth) -->
    <circle cx="-16" cy="-22" r="5" fill="#34d399" />
    <circle cx="16" cy="22" r="5" fill="#38bdf8" />
    <circle cx="0" cy="-32" r="4" fill="#fbbf24" />
  </g>

  <!-- High-Tech Badge Text: 360 -->
  <g transform="translate(100, 158)">
    <rect x="-30" y="-10" width="60" height="16" rx="8" fill="rgba(20, 184, 166, 0.15)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="10.5" fill="#2dd4bf" letter-spacing="2">360°</text>
  </g>
</svg>
