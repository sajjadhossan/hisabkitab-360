<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="ringOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Glow Aura -->
  <circle cx="256" cy="256" r="215" fill="url(#emeraldGlow)" opacity="0.14" filter="url(#glowFilter)" />

  <!-- Outer 360 Degree Continuous Orbital Loop -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringOrbit)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1120 70" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.8" stroke-dasharray="6 6" />

  <!-- Orbital Node Accents -->
  <circle cx="492" cy="256" r="9" fill="#38bdf8" filter="url(#glowFilter)" />
  <circle cx="256" cy="20" r="7" fill="#10b981" filter="url(#glowFilter)" />
  <circle cx="20" cy="256" r="7" fill="#fbbf24" filter="url(#glowFilter)" />

  <!-- Central Crest Shield -->
  <g filter="url(#subtleShadow)">
    <path d="M256 60 L412 118 C412 284 256 432 256 432 C256 432 100 284 100 118 Z" 
          fill="url(#shieldBg)" 
          stroke="url(#emeraldGlow)" 
          stroke-width="6" 
          stroke-linejoin="round" />
          
    <path d="M256 78 L392 130 C392 272 256 402 256 402 C256 402 120 272 120 130 Z" 
          fill="none" 
          stroke="rgba(56, 189, 248, 0.35)" 
          stroke-width="2" 
          stroke-linejoin="round" />
  </g>

  <!-- Dynamic Cooperative Ribbon / Growth Rays -->
  <path d="M166 336 C208 388 256 398 256 398 C256 398 304 388 346 336 C308 358 256 362 256 362 C256 362 204 358 166 336 Z" 
        fill="url(#goldAccent)" opacity="0.95" />

  <!-- Prominent Central '360' Typography with Modern Geometric Styling -->
  <g text-anchor="middle" dominant-baseline="central" filter="url(#subtleShadow)">
    <text x="256" y="215" 
          font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="124" 
          letter-spacing="-4" 
          fill="url(#emeraldGlow)">360</text>
          
    <!-- Degree Symbol -->
    <circle cx="366" cy="160" r="13" fill="none" stroke="url(#goldAccent)" stroke-width="6" />

    <!-- SOMITI BANGLA/ENGLISH BADGE -->
    <rect x="160" y="276" width="192" height="36" rx="18" fill="rgba(15, 23, 42, 0.95)" stroke="url(#emeraldGlow)" stroke-width="2" />
    <text x="256" y="294" 
          font-family="'Inter', 'SolaimanLipi', sans-serif" 
          font-weight="900" 
          font-size="15" 
          letter-spacing="3" 
          fill="#f8fafc">SOMITI 360</text>
  </g>

  <!-- Cooperative Handshake / Growth Leaf Modern Nodes -->
  <path d="M216 122 C236 106 256 106 256 106 C256 106 276 106 296 122" fill="none" stroke="url(#goldAccent)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="256" cy="106" r="5.5" fill="#fbbf24" filter="url(#glowFilter)" />
</svg>